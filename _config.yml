title: uota.github.io
description: uotaの個人サイト
lang: ja
url: https://uota.github.io
baseurl: ""
permalink: pretty

# 開発・デプロイ用のファイルはJekyllの公開ディレクトリにコピーしない。
exclude:
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - wrangler.jsonc
  - README.md
  - scripts
  - node_modules
  - vendor
  - .bundle
  - .wrangler
  - .dev.vars
  - .dev.vars.*

# GoatCounterで発行されたURLを設定するとアクセス解析が有効になります。
# 例: https://example.goatcounter.com/count
goatcounter: https://ennpitsu.goatcounter.com/count
