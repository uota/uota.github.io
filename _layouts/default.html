<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% if site.goatcounter and site.goatcounter != '' %}
    <script data-goatcounter="{{ site.goatcounter }}"
            async src="https://gc.zgo.at/count.js"></script>
    {% endif %}
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav aria-label="メインメニュー">
          <a href="{{ '/articles/' | relative_url }}">記事</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      {{ content }}
      {% if page.collection == "posts" %}
      <p class="post-share">
        <a href="https://twitter.com/intent/tweet?url={{ page.url | absolute_url | cgi_escape }}&amp;text={{ page.title | cgi_escape }}" target="_blank" rel="noopener noreferrer">Xでこの記事を共有</a>
      </p>
      {% endif %}
    </main>
  </body>
</html>
