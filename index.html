<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="個人サイトを準備中です。" />
    <title>工事中 | uota</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Avenir Next", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
        background: #10131a;
        color: #f4f1ea;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 20% 20%, #29334a 0, transparent 32%),
          radial-gradient(circle at 80% 80%, #3b2a32 0, transparent 28%),
          #10131a;
      }
      main {
        width: min(100%, 40rem);
        padding: clamp(2.5rem, 8vw, 5rem) clamp(1.5rem, 7vw, 4.5rem);
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 1.5rem;
        text-align: center;
        background: rgb(16 19 26 / 70%);
        box-shadow: 0 1.5rem 5rem rgb(0 0 0 / 28%);
        backdrop-filter: blur(12px);
      }
      .mark { font-size: 3rem; margin-bottom: 1.5rem; }
      h1 { margin: 0; font-size: clamp(2.2rem, 8vw, 4rem); letter-spacing: .08em; }
      p { margin: 1.25rem 0 0; color: #c8c7c3; font-size: 1.05rem; line-height: 1.9; }
      small { display: block; margin-top: 2.5rem; color: #858995; letter-spacing: .12em; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">🛠️</div>
      <h1>工事中</h1>
      <p>ただいま個人サイトを準備しています。<br />もうしばらくお待ちください。</p>
      <small>COMING SOON</small>
    </main>
  </body>
</html>
